<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart IoT Face Recognition System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .mode-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .mode-btn.active {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .camera-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .camera-wrapper {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .person-info {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .person-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .person-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
        }
        
        .person-details h2 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .person-details .role {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }
        
        .person-details .status {
            color: #27ae60;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .activity-section {
            margin-top: 25px;
        }
        
        .activity-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .activity-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .activity-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .activity-time {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .activity-desc {
            font-size: 14px;
            color: #333;
        }
        
        .health-stats {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .health-stats h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .health-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .health-metric {
            text-align: center;
        }
        
        .health-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .health-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .no-person {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-person i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .detection-status {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #666;
        }
        
        .detection-status.active {
            background: #d4edda;
            color: #155724;
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .health-metrics {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .mode-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .mode-btn {
                width: 200px;
            }
        }
        
        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Touch-friendly for mirror display */
        @media (pointer: coarse) {
            .btn, .mode-btn {
                padding: 15px 25px;
                font-size: 18px;
            }
            
            .activity-item {
                padding: 15px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart IoT Face Recognition System</h1>
            <p>Advanced Employee & Student Management with Health Monitoring</p>
        </div>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('employee')">Employee Mode</button>
            <button class="mode-btn" onclick="setMode('student')">Student Mode</button>
        </div>
        
        <div class="main-content">
            <div class="camera-section">
                <div class="detection-status" id="detectionStatus">
                    <span class="loading"></span> Initializing camera...
                </div>
                <div class="camera-wrapper">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="camera-controls">
                    <button class="btn btn-primary" id="startBtn" onclick="startCamera()">Start Camera</button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopCamera()" disabled>Stop Camera</button>
                    <button class="btn btn-success" onclick="connectIoT()">Connect IoT</button>
                </div>
            </div>
            
            <div class="person-info">
                <div id="personContent">
                    <div class="no-person">
                        <div style="font-size: 48px; margin-bottom: 15px;">#128274;</div>
                        <h3>No Person Detected</h3>
                        <p>Position yourself in front of the camera for face recognition</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

    <script>
        // Global Variables
        let currentMode = 'employee';
        let faceDetection, camera;
        let currentPerson = null;
        let iotConnected = false;
        let iotDeviceUrl = '';
        
        // Mock Database (in real app, this would come from backend API)
        const mockDatabase = {
            employees: [
                {
                    id: 'EMP001',
                    name: 'John Smith',
                    role: 'Software Engineer',
                    department: 'IT',
                    avatar: 'https://picsum.photos/seed/john/200/200',
                    status: 'Active',
                    email: 'john@company.com',
                    phone: '+1234567890',
                    healthStats: {
                        heartRate: 72,
                        temperature: 98.6,
                        stress: 'Low'
                    },
                    activities: [
                        { time: '09:00 AM', desc: 'Checked In', type: 'attendance' },
                        { time: '10:30 AM', desc: 'Meeting with Team', type: 'meeting' },
                        { time: '02:00 PM', desc: 'Lunch Break', type: 'break' },
                        { time: '03:30 PM', desc: 'Code Review', type: 'work' }
                    ],
                    stats: {
                        todayHours: 6.5,
                        weekHours: 32,
                        tasksCompleted: 12,
                        pendingTasks: 3
                    }
                },
                {
                    id: 'EMP002',
                    name: 'Sarah Johnson',
                    role: 'Product Manager',
                    department: 'Product',
                    avatar: 'https://picsum.photos/seed/sarah/200/200',
                    status: 'Active',
                    email: 'sarah@company.com',
                    phone: '+1234567891',
                    healthStats: {
                        heartRate: 68,
                        temperature: 98.4,
                        stress: 'Medium'
                    },
                    activities: [
                        { time: '08:45 AM', desc: 'Checked In', type: 'attendance' },
                        { time: '11:00 AM', desc: 'Sprint Planning', type: 'meeting' },
                        { time: '01:00 PM', desc: 'Client Call', type: 'call' },
                        { time: '04:00 PM', desc: 'Product Demo', type: 'presentation' }
                    ],
                    stats: {
                        todayHours: 7.2,
                        weekHours: 36,
                        tasksCompleted: 8,
                        pendingTasks: 5
                    }
                }
            ],
            students: [
                {
                    id: 'STU001',
                    name: 'Michael Chen',
                    role: 'Computer Science Student',
                    department: 'Engineering',
                    avatar: 'https://picsum.photos/seed/michael/200/200',
                    status: 'Enrolled',
                    email: 'michael@university.edu',
                    phone: '+1234567892',
                    healthStats: {
                        heartRate: 75,
                        temperature: 98.8,
                        stress: 'Low'
                    },
                    activities: [
                        { time: '08:00 AM', desc: 'Class: Data Structures', type: 'class' },
                        { time: '10:00 AM', desc: 'Lab Session', type: 'lab' },
                        { time: '12:00 PM', desc: 'Lunch Break', type: 'break' },
                        { time: '02:00 PM', desc: 'Assignment Submitted', type: 'assignment' }
                    ],
                    stats: {
                        attendance: 92,
                        assignmentsCompleted: 18,
                        pendingAssignments: 2,
                        gpa: 3.8,
                        pendingFees: 0
                    }
                },
                {
                    id: 'STU002',
                    name: 'Emily Davis',
                    role: 'Biology Student',
                    department: 'Science',
                    avatar: 'https://picsum.photos/seed/emily/200/200',
                    status: 'Enrolled',
                    email: 'emily@university.edu',
                    phone: '+1234567893',
                    healthStats: {
                        heartRate: 70,
                        temperature: 98.2,
                        stress: 'Medium'
                    },
                    activities: [
                        { time: '09:00 AM', desc: 'Class: Molecular Biology', type: 'class' },
                        { time: '11:00 AM', desc: 'Lab Work', type: 'lab' },
                        { time: '01:00 PM', desc: 'Study Group', type: 'study' },
                        { time: '03:00 PM', desc: 'Quiz Completed', type: 'quiz' }
                    ],
                    stats: {
                        attendance: 88,
                        assignmentsCompleted: 15,
                        pendingAssignments: 4,
                        gpa: 3.6,
                        pendingFees: 250
                    }
                }
            ]
        };
        
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const detectionStatus = document.getElementById('detectionStatus');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        // Mode Management
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Clear current person display
            currentPerson = null;
            updatePersonDisplay();
        }
        
        // Face Detection
        function onResults(results) {
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);
            
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            const detectedFaces = results.detections || [];
            
            if (detectedFaces.length > 0) {
                detectionStatus.innerHTML = `#2705; Face detected - Identifying...`;
                detectionStatus.classList.add('active');
                
                // Draw face bounding box
                detectedFaces.forEach(detection => {
                    const face = detection.locationData?.relativeBoundingBox || detection.locationData;
                    if (!face) return;
                    
                    const width = face.width || 0.2;
                    const height = face.height || 0.25;
                    const centerX = face.xCenter || 0.5;
                    const centerY = face.yCenter || 0.4;
                    
                    ctx.strokeStyle = '#667eea';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(
                        centerX * w - width * w / 2,
                        centerY * h - height * h / 2,
                        width * w,
                        height * h
                    );
                });
                
                // Simulate face recognition (in real app, this would call face recognition API)
                simulateFaceRecognition();
            } else {
                detectionStatus.innerHTML = 'No face detected';
                detectionStatus.classList.remove('active');
                currentPerson = null;
                updatePersonDisplay();
            }
        }
        
        function simulateFaceRecognition() {
            // Simulate recognition delay
            setTimeout(() => {
                const database = currentMode === 'employee' ? mockDatabase.employees : mockDatabase.students;
                const randomPerson = database[Math.floor(Math.random() * database.length)];
                
                if (randomPerson && Math.random() > 0.3) { // 70% chance of successful recognition
                    currentPerson = randomPerson;
                    detectionStatus.innerHTML = `#2705; ${randomPerson.name} identified`;
                    updatePersonDisplay();
                    
                    // Send IoT command
                    if (iotConnected) {
                        sendIoTCommand('person_recognized', {
                            personId: randomPerson.id,
                            name: randomPerson.name,
                            mode: currentMode,
                            timestamp: new Date().toISOString()
                        });
                    }
                } else {
                    detectionStatus.innerHTML = 'Face not recognized';
                }
            }, 1500);
        }
        
        function updatePersonDisplay() {
            const personContent = document.getElementById('personContent');
            
            if (!currentPerson) {
                personContent.innerHTML = `
                    <div class="no-person">
                        <div style="font-size: 48px; margin-bottom: 15px;">#128274;</div>
                        <h3>No Person Detected</h3>
                        <p>Position yourself in front of the camera for face recognition</p>
                    </div>
                `;
                return;
            }
            
            const isStudent = currentMode === 'student';
            const statsHTML = isStudent ? `
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.attendance}%</div>
                    <div class="stat-label">Attendance</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.gpa}</div>
                    <div class="stat-label">GPA</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.assignmentsCompleted}</div>
                    <div class="stat-label">Assignments Done</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">$${currentPerson.stats.pendingFees}</div>
                    <div class="stat-label">Pending Fees</div>
                </div>
            ` : `
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.todayHours}h</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.weekHours}h</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.tasksCompleted}</div>
                    <div class="stat-label">Tasks Done</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${currentPerson.stats.pendingTasks}</div>
                    <div class="stat-label">Pending</div>
                </div>
            `;
            
            personContent.innerHTML = `
                <div class="person-header">
                    <img src="${currentPerson.avatar}" alt="${currentPerson.name}" class="person-avatar">
                    <div class="person-details">
                        <h2>${currentPerson.name}</h2>
                        <div class="role">${currentPerson.role}</div>
                        <div class="status">Status: ${currentPerson.status}</div>
                    </div>
                </div>
                
                <div class="stats-grid">
                    ${statsHTML}
                </div>
                
                <div class="activity-section">
                    <h3>Recent Activity</h3>
                    <div class="activity-list">
                        ${currentPerson.activities.map(activity => `
                            <div class="activity-item">
                                <div class="activity-time">${activity.time}</div>
                                <div class="activity-desc">${activity.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="health-stats">
                    <h3>Health Monitoring</h3>
                    <div class="health-metrics">
                        <div class="health-metric">
                            <div class="health-value">${currentPerson.healthStats.heartRate}</div>
                            <div class="health-label">Heart Rate</div>
                        </div>
                        <div class="health-metric">
                            <div class="health-value">${currentPerson.healthStats.temperature}&deg;F</div>
                            <div class="health-label">Temperature</div>
                        </div>
                        <div class="health-metric">
                            <div class="health-value">${currentPerson.healthStats.stress}</div>
                            <div class="health-label">Stress Level</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Camera Controls
        async function startCamera() {
            startBtn.disabled = true;
            stopBtn.disabled = false;
            detectionStatus.innerHTML = '<span class="loading"></span> Initializing camera...';
            
            try {
                faceDetection = new FaceDetection({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                });
                
                faceDetection.setOptions({
                    model: 'short',
                    minDetectionConfidence: 0.3
                });
                
                faceDetection.onResults(onResults);
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
                
                camera = new Camera(video, {
                    onFrame: async () => {
                        await faceDetection.send({ image: video });
                    },
                    width: 640,
                    height: 480
                });
                
                camera.start();
                detectionStatus.innerHTML = 'Camera ready - Looking for faces...';
                
            } catch (error) {
                console.error('Error starting camera:', error);
                detectionStatus.innerHTML = 'Error: Could not access camera';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }
        
        function stopCamera() {
            if (camera) {
                camera.stop();
            }
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            detectionStatus.innerHTML = 'Camera stopped';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            currentPerson = null;
            updatePersonDisplay();
        }
        
        // IoT Functions
        async function connectIoT() {
            const url = prompt('Enter IoT device URL:', 'http://192.168.1.100');
            if (!url) return;
            
            iotDeviceUrl = url;
            
            try {
                const response = await fetch(`${iotDeviceUrl}/ping`, { method: 'GET', mode: 'cors' });
                iotConnected = true;
                detectionStatus.innerHTML = '#2705; IoT Connected';
                
                // Send initial status
                await sendIoTCommand('system_ready', {
                    mode: currentMode,
                    timestamp: new Date().toISOString()
                });
                
            } catch (error) {
                console.error('IoT connection failed:', error);
                detectionStatus.innerHTML = 'IoT connection failed';
                iotConnected = false;
            }
        }
        
        async function sendIoTCommand(command, data) {
            if (!iotConnected) return;
            
            try {
                const payload = {
                    command: command,
                    data: data,
                    timestamp: new Date().toISOString(),
                    source: 'face_recognition_system'
                };
                
                const response = await fetch(`${iotDeviceUrl}/api/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    body: JSON.stringify(payload)
                });
                
                console.log('IoT command sent:', payload);
            } catch (error) {
                console.error('Failed to send IoT command:', error);
            }
        }
        
        // Handle video metadata
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });
        
        // Initialize
        updatePersonDisplay();
    </script>
</body>
</html>
